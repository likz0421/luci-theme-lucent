<script>
/* Minimal LuCI shim so the real view modules can run outside OpenWrt. */
var SVG_TAGS = ['svg','path','circle','rect','g','defs','lineargradient','stop','line','polyline','polygon','text','tspan','use','filter','clippath'];
function E(tag, attrs, children) {
	if (Array.isArray(tag)) {
		var frag = document.createDocumentFragment();
		tag.forEach(function (k) {
			if (k == null || k === false || k === '')
				return;
			frag.appendChild(k instanceof Node ? k : E(k));
		});
		return frag;
	}

	var el = SVG_TAGS.indexOf(String(tag).toLowerCase()) >= 0
		? document.createElementNS('http://www.w3.org/2000/svg', tag)
		: document.createElement(tag);

	function add(kids) {
		(kids == null ? [] : (Array.isArray(kids) ? kids : [kids])).forEach(function (k) {
			if (k == null || k === false || k === '')
				return;
			if (typeof k === 'number')
				k = String(k);
			if (Array.isArray(k))
				return add(k);
			if (k instanceof Node)
				el.appendChild(k);
			else
				el.appendChild(document.createTextNode(String(k)));
		});
	}

	if (attrs && typeof attrs === 'object' && !(attrs instanceof Node) && !Array.isArray(attrs)) {
		Object.keys(attrs).forEach(function (k) {
			var v = attrs[k];
			if (typeof v === 'function')
				el.addEventListener(k.replace(/^on/, ''), v);
			else if (v === true)
				el.setAttribute(k, '');
			else if (v != null && v !== false)
				el.setAttribute(k, v);
		});
		add(children);
	}
	else {
		add(attrs);
	}
	return el;
}
window.E = E;
window._ = function (s) { return s; };
if (!String.prototype.format) {
	String.prototype.format = function () {
		var args = Array.prototype.slice.call(arguments), i = 0;
		return String(this).replace(/%(\d*\.?\d*)?([sdfj%])/g, function (m, num, type) {
			if (type === '%')
				return '%';
			var a = args[i++];
			switch (type) {
				case 'd': return String(parseInt(a, 10));
				case 'f': return num && num.indexOf('.') >= 0 ? Number(a).toFixed(parseInt(num.split('.')[1], 10)) : String(Number(a));
				case 'j': return JSON.stringify(a);
				default: return a == null ? '' : String(a);
			}
		});
	};
}
window.L = {
	url: function () {
		return '/cgi-bin/luci/' + Array.prototype.slice.call(arguments).join('/');
	},
	bind: function (f, c) { return f.bind(c); },
	resolveDefault: function (p, d) { return Promise.resolve(p).catch(function () { return d; }); },
	isObject: function (v) { return v != null && typeof v === 'object'; },
	/* the real L.require would fetch modules; here it must fail like a missing
	   file so core's watchdog path is the one under test */
	require: function () { return Promise.reject(new Error('harness: no module loader')); },
	env: { dispatchpath: ['admin', 'home'], requestpath: ['admin', 'home'] }
};

var NOW = Math.floor(Date.now() / 1000);
var MOCK = {
	'system.board': { boardname: 'OpenWrt', hostname: 'OpenWrt', model: 'Test Router', kernel: '6.12.112', system: 'test arch', release: { description: 'OpenWrt 25.12.6', revision: 'r33311' } },
	'system.info': { uptime: 46213, localtime: NOW, memory: { total: 506507264, free: 120586240, buffered: 33554432, cache: 67108864 }, load: [16384, 8192, 4096] },
	'network.interface.dump': { 'interface': [
		{ interface: 'loopback', up: true },
		{ interface: 'wan', up: true, proto: 'pppoe', device: 'pppoe-wan', l3_device: 'pppoe-wan', uptime: 3600,
			'ipv4-address': [{ address: '100.64.1.2' }],
			route: [{ target: '0.0.0.0', mask: 0, nexthop: '100.64.0.1' }],
			'dns-server': ['119.8.8.8', '114.114.114.114'] },
		{ interface: 'wan6', up: true, proto: 'dhcpv6',
			'ipv6-address': [{ address: '2408:8266::2', valid: 2490 }],
			route: [{ target: '::', mask: 0, nexthop: 'fe80::1' }] },
		{ interface: 'lan', up: true, proto: 'static', l3_device: 'br-lan',
			'ipv4-address': [{ address: '192.168.1.1' }] }
	] },
	'luci-rpc.getHostHints': { 'aa:bb:cc:00:00:01': { name: 'phone', mac: 'aa:bb:cc:00:00:01', ipaddrs: ['192.168.1.30'] } },
	'luci-rpc.getDHCPLeases': { dhcp_leases: [
		{ macaddr: 'aa:bb:cc:00:00:01', hostname: 'phone', ipaddr: '192.168.1.30', expires: NOW + 7200 },
		{ macaddr: 'aa:bb:cc:00:00:02', hostname: 'laptop', ipaddr: '192.168.1.31', expires: NOW + 86400 }
	] },
	'luci-rpc.getWirelessDevices': {
		radio0: { up: true, interfaces: [{ ifname: 'wlan0', config: { ssid: 'MyHome-2.4G' } }] },
		radio1: { up: true, interfaces: [{ ifname: 'wlan1', config: { ssid: 'MyHome-5G' } }] }
	},
	'luci-rpc.getNetworkDevices': { 'pppoe-wan': { statistics: { rx_bytes: 1258291200, tx_bytes: 356515840 } }, 'br-lan': { statistics: { rx_bytes: 999, tx_bytes: 888 } } },
	'luci.lucent.storage': { '/': { total: 103079215, free: 76545000 } },
	'luci-rpc.getConnsPerHost': { '192.168.1.30': { count: 12 }, '192.168.1.31': { count: 3 } },
	'luci.lucent.overview': { version: '3.9.0-r1', cores: 4, cpus: [42, 17, 63, 8], load1: '0.25', load5: '0.31', processes_running: 2, processes_total: 128, conntrack: 85, conntrack_max: 28160, temp_c: 46 },
	'luci.lucent.theme_check': { current: '3.7.2-r1', latest: '3.7.3', available: true },
	'luci.lucent.theme_status': { running: 0, code: -1, log: '' },
	'luci.lucent.pkg_updates': { count: 4 },
	'luci.lucent.topology': {
		bridge: 'br-lan',
		wan_device: 'eth0',
		wan_iface: 'eth0.2',
		lan_device: 'eth0',
		lan_ifname: 'eth0.1',
		ports: [
			{ device: 'lan1', state: 'up', wireless: 0, speed: 1000, duplex: 'full', label: 'lan1', mac: '00:11:22:33:44:01' },
			{ device: 'lan2', state: 'down', wireless: 0, label: 'lan2', mac: '00:11:22:33:44:02' },
			{ device: 'wlan0', state: 'up', wireless: 1, label: 'wlan0' },
			{ device: 'wlan1', state: 'up', wireless: 1, label: 'wlan1' }
		],
		fdb: [
			{ mac: 'AA:BB:CC:00:00:02', port: 'lan1' },
			{ mac: 'DD:EE:FF:00:00:09', port: 'lan1' }
		]
	},
	'luci.lucent.host_rates': {
		enabled: 1,
		wanted: 1,
		hosts: 3,
		seconds: NOW,
		rates: {
			'192.168.1.30': { rx_rate: 4200000, tx_rate: 310000, rx_total: 88000000, tx_total: 4400000, age: 0 },
			'192.168.1.31': { rx_rate: 120000, tx_rate: 9000, rx_total: 1200000, tx_total: 90000, age: 45 }
		}
	},
	'luci-rpc.getWirelessAssocList': { radio: 'radio0' }
};

/* the assoc list is per interface, so it needs the call argument */
var ASSOC = {
	wlan0: [
		{ mac: 'aa:bb:cc:00:00:01', signal: -48, rx_bytes: 1000, tx_bytes: 200 },
		{ mac: '11:22:33:44:55:66', signal: -71 }
	],
	wlan1: []
};

/* Root menu node in the shape /admin/menu serves: children keyed by node name,
   each carrying `satisfied` and `title`. */
function node(title, order, children) {
	return { title: title, order: order, satisfied: true, children: children || {} };
}
var MENU = node(null, 0, {
	admin: node('Admin', 10, {
		home: node('Home', 1),
		clients: node('Devices', 2),
		status: node('Status', 3, {
			realtime: node('Realtime', 1),
			load: node('Load', 2),
			sessions: node('Sessions', 3)
		}),
		network: node('Network', 5, {
			network: node('Interfaces', 1),
			wireless: node('Wireless', 2),
			dhcp: node('DHCP Leases', 3)
		}),
		services: node('Services', 6, {
			cron: node('Cron Control', 1)
		}),
		vpn: node('VPN', 7, {
			o: node('OpenVPN', 1)
		}),
		system: node('System', 8, {
			general: node('System', 1),
			packages: node('Software', 2),
			advanced: node('Tuning', 3),
			admin: node('Administration', 4)
		}),
		logout: node('Logout', 99)
	})
});

var rpc = { declare: function (spec) {
	return function () {
		var key = spec.object + '.' + spec.method;
		if (key === 'iwinfo.assoclist' || key === 'luci-rpc.getWirelessAssocList')
			return Promise.resolve({ results: ASSOC[arguments[0]] || [] });
		if (key === 'luci.lucent.host_rates' && MOCK['luci.lucent.host_rates'].bump) {
			var r = MOCK['luci.lucent.host_rates'].rates['192.168.1.30'];
			r.rx_rate += 900000;
			r.age = 0;
		}
		return Promise.resolve(MOCK[key] !== undefined ? MOCK[key] : {});
	};
} };
var baseclass = {
	extend: function (o) {
		var res = Object.create(baseclass);
		Object.keys(o).forEach(function (k) { res[k] = o[k]; });
		return res;
	}
};
var uci = { load: function () { return Promise.resolve(); }, get: function () { return null; }, set: function () {}, save: function () { return Promise.resolve(); } };
var poll = { add: function () {} };
var view = baseclass;
var ui = { menu: {
	load: function () { return Promise.resolve(MENU); },
	getChildren: function (n) {
		var kids = (n && n.children) || {};
		return Object.keys(kids)
			.filter(function (k) { return kids[k].satisfied && kids[k].title != null; })
			.map(function (k) {
				var c = kids[k];
				c.name = k;
				return c;
			})
			.sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
	}
} };

var REPORT = [];
function check(name, ok, detail) {
	REPORT.push('%s %s%s'.format(ok ? 'PASS' : 'FAIL', name, detail != null ? ' — ' + detail : ''));
	document.getElementById('report').textContent = REPORT.join('\n');
	if (!ok)
		document.title = 'HARNESS_FAILED';
}

/* Surface setup failures instead of swallowing them as unhandled rejections. */
function bail(where, err) {
	REPORT.push('THREW in %s — %s'.format(where, (err && err.stack || err)));
	document.getElementById('report').textContent = REPORT.join('\n');
	document.getElementById('root').textContent = 'RUNTIME ERROR in %s: %s'.format(where, err && err.stack || err);
	document.title = 'HARNESS_ERROR';
}
window.addEventListener('error', function (ev) { bail('window', ev.error || ev.message); });
window.addEventListener('unhandledrejection', function (ev) { bail('rejection', ev.reason); });

async function mod(path) {
	var resp = await fetch(path);
	var src = await resp.text();
	var fn = new Function('L', 'rpc', 'baseclass', 'uci', 'poll', 'view', 'E', '_', 'ui', 'core', 'util', src);
	var res = fn(window.L, rpc, baseclass, uci, poll, view, E, window._, ui, registry.core, registry.util);

	if (res === undefined)
		throw new Error('%s → %d %d bytes, body starts %s'.format(path, resp.status, src.length, JSON.stringify(src.slice(0, 60))));

	/* LuCI's require instantiates baseclass modules, which runs __init. */
	if (typeof res.__init === 'function')
		res.__init();

	return res;
}

var registry = { core: null, util: null };
/* absolute, so the later pathname rewrite cannot break these fetches */
var base = new URL('../htdocs/luci-static/resources/', document.baseURI).href;

function wait(ms) {
	return new Promise(function (r) { setTimeout(r, ms); });
}

/* #rail and #drawer force the two sidebar modes so they can be screenshotted. */
var FLAGS = location.hash || '';

/* The menu is cached in localStorage per session, so every scenario starts
   from a clean slate — otherwise a run of the healthy tree would let the
   failure runs paint from it and hide the very fallback being tested.
   #menu-cache is the exception: it seeds the copy on purpose. */
var menuCache = /#menu-cache/.test(FLAGS);
var menuNoStore = /#menu-nostore/.test(FLAGS);
try {
	localStorage.clear();
	if (menuCache)
		localStorage.setItem('lucent.menu.anon', JSON.stringify({ b: 11, d: JSON.stringify(MENU) }));
} catch (e) {}

if (menuNoStore) {
	/* private mode, and a few embedded browsers, refuse localStorage outright:
	   then the instant paint can never happen on any page, and that has to be
	   visible instead of looking like a broken cache */
	localStorage.setItem = function () { throw new Error('QuotaExceededError (mock private mode)'); };
}

(async function () {
	registry.util = await mod(base + 'lucent/util.js');
	registry.core = await mod(base + 'lucent/core.js');
	var home = await mod(base + 'view/lucent/home.js');
	var clients = await mod(base + 'view/lucent/clients.js');

	/* menu failure scenarios: the sidebar must never end up blank */
	var menuFail = /#menu-(reject|empty|noclass|hang|throw|noload|cache)/.test(FLAGS);
	var noisy = /#tree-noisy/.test(FLAGS);
	if (/#menu-reject/.test(FLAGS))
		ui.menu.load = function () { return Promise.reject(new Error('mock session failure')); };
	if (/#menu-empty/.test(FLAGS))
		ui.menu.load = function () { return Promise.resolve({ children: {} }); };
	if (/#menu-noclass/.test(FLAGS))
		ui.menu = null;
	/* what the stripped ONT build did: throw synchronously, which used to make
	   the whole module reject and the sidebar stay silently empty */
	if (/#menu-throw/.test(FLAGS))
		ui.menu.load = function () { throw new Error('mock synchronous explosion'); };
	/* the menu module never loads at all: core.js must still explain the sidebar */
	var menuSkip = /#menu-noload/.test(FLAGS);
	/* a forked build whose requestpath matches no root child */
	if (/#menu-nomatch/.test(FLAGS))
		window.L.env.requestpath = ['notadmin'];
	/* a request that never answers must still fall back, on a deadline */
	if (/#menu-(hang|cache)/.test(FLAGS))
		ui.menu.load = function () { return new Promise(function () {}); };

	if (/#manyports/.test(FLAGS)) {
		var extra = [];
		for (var pi = 1; pi <= 13; pi++)
			extra.push({ device: 'lan' + pi, state: pi % 3 ? 'up' : 'down', wireless: 0, speed: 1000, label: 'lan' + pi });
		MOCK['luci.lucent.topology'].ports = [{ device: 'wlan0', state: 'up', wireless: 1, label: 'wlan0' },
			{ device: 'wlan1', state: 'up', wireless: 1, label: 'wlan1' }].concat(extra);
		MOCK['luci.lucent.topology'].fdb = [];
	}

	/* what the ONU actually reports: 22 unconnected FTTR ports and a pile of
	   hosts the forwarding table cannot place */
	if (/#tree-noisy/.test(FLAGS)) {
		var fttr = [];
		for (var fi = 1; fi <= 22; fi++)
			fttr.push({ device: 'fttr' + fi, wireless: 0 });
		MOCK['luci.lucent.topology'].ports = fttr;
		MOCK['luci.lucent.topology'].fdb = [];

		var leases = [], hints = {};
		for (var hi = 1; hi <= 15; hi++) {
			var mac = '0E:DD:BC:4D:F7:' + (hi < 16 ? '0' : '') + hi.toString(16);
			leases.push({ macaddr: mac, hostname: 'node' + hi, ipaddr: '192.168.1.' + (100 + hi), expires: NOW + 3600 });
			hints[mac] = { mac: mac, name: 'node' + hi, ipaddrs: ['192.168.1.' + (100 + hi)] };
		}
		MOCK['luci-rpc.getDHCPLeases'].dhcp_leases = leases;
		MOCK['luci-rpc.getHostHints'] = hints;
		ASSOC = {};
	}

	var menu = menuSkip ? null : await mod(base + 'menu-lucent.js');
	/* menu-lucent paints from its own copy inside __init, which is synchronous:
	   measuring here is what proves the sidebar is filled before any answer */
	var paintNow = document.querySelectorAll('#topmenu > li:not(.ltc-nav-note)').length;
	var noteNow = !!document.querySelector('#topmenu .ltc-nav-note');
	var side = await mod(base + 'lucent/sideinfo.js');

	side.init();
	registry.core.init();

	var v = Object.create(home);
	var dash = null;

	v.load().then(function (d) {
		dash = d;
		var el = v.render(d);
		document.getElementById('view').textContent = '';
		document.getElementById('view').appendChild(el);
		window.__home = v;
		return wait(1500);
	}).then(function () {
		var c = Object.create(clients);
		return c.load().then(function (cd) {
			document.getElementById('view').appendChild(c.render(cd));
		});
	}).then(function () { return wait(menuSkip ? 19000 : 1300); }).then(function () {
		/* sidebar traffic: two more samples with moved counters */
		MOCK['luci-rpc.getNetworkDevices']['pppoe-wan'] = { statistics: { rx_bytes: 1260000000, tx_bytes: 357000000 } };
		side._n = 3;
		side.tick();
		return wait(1300);
	}).then(function () {
		MOCK['luci-rpc.getNetworkDevices']['pppoe-wan'] = { statistics: { rx_bytes: 1264800000, tx_bytes: 357640000 } };
		side._n = 4;
		side.tick();
		return wait(2600);
	}).then(function () {
		/* markActive() compares against location.pathname, which on a router is
		   /cgi-bin/luci/admin/<page>. Mirror that here when the origin allows it. */
		var pathOk = false;
		try {
			history.replaceState(null, '', '/cgi-bin/luci/admin/home');
			pathOk = true;
		} catch (e) {}

		registry.core.markActive();

		var top = document.querySelectorAll('#topmenu > li');
		var groups = document.querySelectorAll('#topmenu > li.dropdown');
		var panel = document.querySelector('.ltc-side-info');
		var rows = document.querySelectorAll('.ltc-si-rows li');
		var visible = Array.prototype.filter.call(rows, function (li) { return li.style.display !== 'none'; });
		var curve = document.querySelector('.ltc-si-curve .rx');
		var skel = document.querySelectorAll('.ltc-side-info .ltc-skel');
		var bar = panel && panel.querySelector('[data-si-bar=sto]');

		function txt(key) {
			var el = panel && panel.querySelector('[data-si=' + key + ']');
			return el ? el.textContent : null;
		}

		document.title = 'HARNESS_READY';
		check('pathname patched', pathOk, location.pathname);
		check('menu entries', top.length >= 6, top.length + ' top level');

		/* the footer marker is what the user can read off a screenshot, so it has
		   to name the source even when everything worked */
		var marker = (document.querySelector('.ltc-foot [data-ltc-menu]') || {}).textContent || '';
		var want = menuSkip ? 'builtin' : (menuCache ? 'cache' : (menuFail ? 'builtin' : 'tree'));
		var owner = menuSkip ? '#core' : '#menu11';

		check('footer names the menu source', marker.indexOf('menu:' + want) === 0,
			marker || 'no marker');
		check('footer names who drew it', marker.indexOf(owner) > 0, marker || 'no marker');
		var marks = document.querySelectorAll('[data-ltc-menu]');
		check('the home card repeats it', marks.length >= 2 &&
			marks[0].textContent === marks[marks.length - 1].textContent && marks[0].textContent !== '',
			marks.length + ' markers: ' + Array.prototype.map.call(marks, function (m) { return m.textContent; }).join(' / '));
		check('menu state readable from the console',
			!!(window.__lucentMenu && window.__lucentMenu.items >= 6 && window.__lucentMenu.navH > 20 &&
				window.__lucentMenu.store === (menuNoStore ? 'off' : 'on')),
			JSON.stringify(window.__lucentMenu || {}));
		if (menuNoStore) {
			check('blocked storage is named in the marker', /cache:off/.test(marker), marker || 'no marker');
			check('the menu works without storage',
				document.querySelectorAll('#topmenu > li:not(.ltc-nav-note)').length >= 6, marker);
		}
		check('submenu groups', groups.length >= 3, groups.length + ' groups');
		check('nav icons injected',
			document.querySelectorAll('.ltc-nav svg.ltc-nav-ic').length >= document.querySelectorAll('#topmenu > li > a').length,
			document.querySelectorAll('.ltc-nav svg.ltc-nav-ic').length + ' icons / ' + document.querySelectorAll('#topmenu > li > a').length + ' links');
		if (menuFail) {
			check('fallback note shown', !!document.querySelector('.ltc-nav-note'));
			var noteSmall = document.querySelector('.ltc-nav-note small');
			check('note carries the JS build marker', !!noteSmall && noteSmall.textContent.indexOf(menuSkip ? '#core' : '#menu') >= 0,
				noteSmall ? noteSmall.textContent.slice(0, 70) : 'no small');
			check('retry button present', !!document.querySelector('.ltc-nav-note .ltc-btn'));
			check('fallback keeps groups', document.querySelectorAll('#topmenu > li.dropdown').length >= 3);
		}
		if (menuSkip) {
			check('watchdog spoke instead of silence', !!document.querySelector('.ltc-nav-note'),
				document.querySelectorAll('#topmenu li').length + ' li, note ' + !!document.querySelector('.ltc-nav-note'));
			check('watchdog offers a retry', !!document.querySelector('.ltc-nav-note .ltc-btn'));
			check('watchdog menu is usable', document.querySelectorAll('#topmenu > li.dropdown').length >= 3,
				document.querySelectorAll('#topmenu > li').length + ' entries, ' + document.querySelectorAll('#topmenu > li.dropdown').length + ' groups');
		}
		if (/#menu-(hang|cache)/.test(FLAGS)) {
			var why = document.querySelector('.ltc-nav-note small');
			check('hanging menu hits its deadline', !!why && /timed out/.test(why.textContent),
				why && why.textContent.slice(0, 80));
			check('hang still yields a menu', document.querySelectorAll('#topmenu > li').length >= 7,
				document.querySelectorAll('#topmenu > li').length + ' entries');
		}
		if (menuCache) {
			var live = document.querySelectorAll('#topmenu > li:not(.ltc-nav-note)').length;
			var spoken = document.querySelector('.ltc-nav-note span');
			check('cached menu painted before any answer', paintNow >= 6, paintNow + ' entries at require time');
			check('nothing wiped while the request was in flight', !noteNow && paintNow >= 6,
				'note=' + noteNow + ' items=' + paintNow);
			check('a failed reload keeps it', live >= 6, live + ' entries after the deadline');
			check('and says so', !!spoken && /restored from this browser/.test(spoken.textContent),
				spoken && spoken.textContent.slice(0, 60));
			check('reload did not stack a second menu', live === paintNow,
				paintNow + ' painted, ' + live + ' now');
		}
		if (!menuFail && !menuNoStore) {
			var stored = null;
			try { stored = JSON.parse(localStorage.getItem('lucent.menu.anon')); } catch (e) {}
			check('menu cached for the next page', !!stored && stored.b === 11 && !!stored.d,
				stored ? (stored.d.length + ' bytes') : 'nothing stored');
		}
		if (/#manyports/.test(FLAGS)) {
			var shown = document.querySelectorAll('.ltc-tnode.port').length;
			var moreBtn = document.querySelector('.ltc-tnode.more');
			check('ports capped', shown === 8, shown + ' shown');
			check('more toggle present', !!moreBtn, moreBtn && moreBtn.textContent);
			if (moreBtn) {
				moreBtn.dispatchEvent(new MouseEvent('click', { bubbles: true }));
				var after = document.querySelectorAll('.ltc-tnode.port').length;
				check('toggle expands the rest', after === 15 && !document.querySelector('.ltc-tnode.more'),
					after + ' after click');
			}
		}
		check('active link marked', document.querySelectorAll('.ltc-nav a.on').length === 1,
			'on=' + document.querySelectorAll('.ltc-nav a.on').length);

		/* a page inside a group must open that group and keep others closed */
		try { history.replaceState(null, '', '/cgi-bin/luci/admin/system/packages'); } catch (e) {}
		registry.core.markActive();
		var onNested = document.querySelectorAll('.ltc-nav a.on');
		var groupsOpen = document.querySelectorAll('#topmenu > li.open').length;
		check('nested page opens its group',
			onNested.length === 1 && groupsOpen === 1 && /system\/packages$/.test(onNested[0].getAttribute('href')),
			'on=' + onNested.length + ' open=' + groupsOpen);
		try { history.replaceState(null, '', '/cgi-bin/luci/admin/home'); } catch (e) {}
		registry.core.markActive();
		check('sidebar panel exists', !!panel);
		check('panel rows visible', visible.length >= 5, visible.length + '/' + rows.length);
		check('cpu dial reads', /%$/.test(txt('cpu') || ''), txt('cpu'));
		check('mem dial reads', /%$/.test(txt('mem') || ''), txt('mem'));
		check('dial --val set', !!(panel && panel.querySelector('[data-si-dial=cpu]').style.getPropertyValue('--val')));
		check('wan address', /^[\d.]+$/.test(txt('wan') || ''), txt('wan'));
		check('lan address', txt('lan') === '192.168.1.1', txt('lan'));
		check('uptime', /\d/.test(txt('up') || ''), txt('up'));
		check('devices', /\d/.test(txt('dev') || ''), txt('dev'));
		check('wifi ssid', /MyHome/.test(txt('wifi') || ''), txt('wifi'));
		check('temp', /°C$/.test(txt('temp') || ''), txt('temp'));
		check('storage bar', !!bar && bar.style.width !== '', txt('sto'));
		check('traffic curve drawn', !!(curve && curve.getAttribute('d').length > 12), curve && curve.getAttribute('d').slice(0, 26));
		check('rx rate', /↓/.test(txt('rx') || ''), txt('rx'));
		check('tx rate', /↑/.test(txt('tx') || ''), txt('tx'));
		check('conntrack tag', /\d/.test(txt('ct') || ''), txt('ct'));
		check('clock ticking', /\d\d/.test(txt('clock') || ''), txt('clock'));
		check('skeletons cleared', skel.length === 0, skel.length + ' left');

		/* ---- branching topology tree ---- */
		var tree = document.querySelector('.ltc-tree');
		var ports = document.querySelectorAll('.ltc-tnode.port');
		var leaves = document.querySelectorAll('.ltc-tnode.leaf');
		var leafText = Array.prototype.map.call(leaves, function (n) {
			return n.textContent;
		}).join(' | ');
		var portText = Array.prototype.map.call(ports, function (n) { return n.textContent; }).join(' | ');

		check('tree rendered', !!tree && !!document.querySelector('.ltc-tnode.root'));
		if (!noisy) {
			/* an unconnected port belongs in the idle summary, not in the list */
			check('active ports shown', ports.length >= 3, ports.length + ' port rows');
			check('wired port speed shown', /1000 Mb\/s/.test(portText), portText.slice(0, 70));
			check('ssid on radio node', /MyHome-2\.4G/.test(portText));
			check('stations + fdb leaves', leaves.length >= 2, leaves.length + ' leaves');
			check('phone placed under radio', /phone/.test(leafText), leafText.slice(0, 90));
			check('laptop placed under lan1', /laptop/.test(leafText));
			check('every host placed on a branch', !/Other links/.test(leafText + portText), 'no catch-all needed');
			check('per-host rate in tree', !!document.querySelector('[data-live=hr-192-168-1-30]'),
				document.querySelector('[data-live=hr-192-168-1-30]') && document.querySelector('[data-live=hr-192-168-1-30]').textContent);
		}
		check('idle ports collapsed', !!document.querySelector('.ltc-tnode.other'),
			document.querySelectorAll('.ltc-tnode.other').length + ' summary rows');

		/* ---- top talkers ---- */
		var talkers = document.querySelectorAll('[data-talkers] li');
		var first = talkers[0];
		if (!noisy) check('talkers listed', talkers.length >= 2, talkers.length + ' rows');
		if (!noisy) check('heaviest first', !!first && /phone/.test(first.querySelector('.who').textContent),
			first && first.querySelector('.who').textContent);
		check('talker bar scaled', !!first && /width:100%/.test(first.querySelector('.bar u').getAttribute('style')));
		check('talker rates formatted', !!first && /↓/.test(first.querySelector('.val').textContent),
			first && first.querySelector('.val').textContent);

		/* ---- devices page rate column ---- */
		var heads = document.querySelectorAll('.ltc-content .table .table-titles .th');
		var rateCells = document.querySelectorAll('.ltc-rate');
		check('devices table has rate column', heads.length >= 7, heads.length + ' columns');
		if (!noisy) check('devices rate cells filled', rateCells.length >= 2 && /↓/.test(rateCells[0].textContent),
			rateCells.length + ' cells');

		/* Being in the DOM is not the same as being visible: measure pixels. */
		var navEl = document.querySelector('.ltc-nav');
		var navBox = navEl && navEl.getBoundingClientRect();
		var first = document.querySelector('#topmenu > li');
		var firstBox = first && first.getBoundingClientRect();
		var firstOp = first ? getComputedStyle(first).opacity : '0';
		var panelEl = document.querySelector('.ltc-side-info');
		var panelBox = panelEl && panelEl.getBoundingClientRect();

		check('nav has real height', !!navBox && navBox.height >= Math.min(220, innerHeight * 0.4),
			navBox ? Math.round(navBox.height) + 'px (viewport ' + innerWidth + 'x' + innerHeight + ')' : 'no nav');
		check('first menu item painted', !!firstBox && firstBox.height > 20 && firstOp === '1',
			firstBox ? Math.round(firstBox.height) + 'px opacity=' + firstOp + ' top=' + Math.round(firstBox.top) : 'no item');
		check('panel does not eat the drawer', innerWidth > 980 || !panelBox || panelBox.height < innerHeight * 0.45,
			panelBox ? Math.round(panelBox.height) + 'px of ' + innerHeight + ' at ' + innerWidth + 'px' : 'no panel');
		check('panel collapsed by default on phones',
			innerWidth > 980 || !panelEl || panelEl.dataset.open === '0',
			panelEl ? 'open=' + panelEl.dataset.open + ' at ' + innerWidth + 'px' : 'no panel');
		check('every top-level item reachable by the nav scroll', (function () {
			var items = document.querySelectorAll('#topmenu > li');
			var last = items[items.length - 1];

			if (!last || !navEl)
				return false;

			/* offsetTop is relative to .ltc-side, not the scroller — measure
			   inside the nav's own scroll coordinates instead */
			var bottom = last.getBoundingClientRect().bottom - navEl.getBoundingClientRect().top + navEl.scrollTop;

			return bottom <= navEl.scrollHeight + 1;
		})(), navEl ? 'scrollHeight ' + navEl.scrollHeight : 'no nav');

		if (/#tree-noisy/.test(FLAGS)) {
			var tRows = document.querySelectorAll('.ltc-tnode').length;
			var tPorts = document.querySelectorAll('.ltc-tnode.port').length;
			var tOther = document.querySelectorAll('.ltc-tnode.other').length;
			var tLeaves = document.querySelectorAll('.ltc-tnode.leaf').length;

			check('idle ports collapsed', tPorts === 0 && tOther === 2, tPorts + ' port rows, ' + tOther + ' summary rows');
			check('tree stays short', tRows <= 12, tRows + ' rows for 22 ports + 15 hosts');
			check('stray hosts capped at 6', tLeaves === 6, tLeaves + ' leaves before expanding');
			var tMore = document.querySelector('.ltc-tnode.more');
			if (tMore) {
				tMore.dispatchEvent(new MouseEvent('click', { bubbles: true }));
				check('more reveals the rest', document.querySelectorAll('.ltc-tnode.leaf').length === 15,
					document.querySelectorAll('.ltc-tnode.leaf').length + ' leaves after click');
			}
			else {
				check('more reveals the rest', false, 'no toggle found');
			}
		}

		return v.applyLive(dash);
	}).then(function () {
		/* second dashboard poll round, per the live-widget rule */
		MOCK['luci-rpc.getNetworkDevices']['pppoe-wan'] = { statistics: { rx_bytes: 1270000000, tx_bytes: 358900000 } };
		MOCK['luci.lucent.host_rates'].bump = 1;
		return v.load();
	}).then(function (d2) {
		var cell = document.querySelector('[data-live=hr-192-168-1-30]');
		var before = cell ? cell.textContent : '';
		v.applyLive(d2);
		var after = cell ? cell.textContent : '';
		if (!noisy) check('tree rate refreshed', before !== after, before + ' → ' + after);
		return wait(400);
	}).then(function () {
		var live = document.querySelector('[data-live=spark-now]');
		check('dashboard live after 2nd round', !!(live && /↓/.test(live.textContent)), live && live.textContent);

		if (/#rail/.test(FLAGS))
			document.documentElement.dataset.rail = '1';
		if (/#drawer/.test(FLAGS))
			document.body.classList.add('ltc-menu-open');
		if (/#report/.test(FLAGS))
			document.body.classList.add('show-report');

		document.title = /FAIL|THREW/.test(REPORT.join('\n')) ? 'HARNESS_FAILED' : 'HARNESS_READY';
	}).catch(function (err) {
		bail('chain', err);
	});
})().catch(function (err) {
	bail('setup', err);
});
</script>
</body>
</html>
