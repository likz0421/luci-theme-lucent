			if (type === '%')

};

var NOW = Math.floor(Date.now() / 1000);

};

var ASSOC = {
	wlan0: [
		{ mac: 'aa:bb:cc:00:00:01', signal: -48, rx_bytes: 1000, tx_bytes: 200 },
		{ mac: '11:22:33:44:55:66', signal: -71 },

	return { title: title, order: order, satisfied: true, children: children || {} };
}
var MENU = node(null, 0, {
	admin: node('Admin', 10, {
		home: node('Home', 1),
		clients: node('Devices', 2),
		status: node('Status', 3, {
			realtime: node('Realtime', 1),
			load: node('Load', 2),
			sessions: node('Sessions', 3)
		}),
		network: node('Network', 5, {
			network: node('Interfaces', 1),

		}),

		}),

});

	return function () {
		var key = spec.object + '.' + spec.method;
		if (key === 'iwinfo.assoclist' || key === 'luci-rpc.getWirelessAssocList')
			return Promise.resolve({ results: ASSOC[arguments[0]] || [] });
		if (key === 'iwinfo.info')
			return Promise.resolve(RADIO[arguments[0]] || {});
		if (key === 'luci.lucent.host_rates' && MOCK['luci.lucent.host_rates'].bump) {
			var r = MOCK['luci.lucent.host_rates'].rates['192.168.1.30'];
			r.rx_rate += 900000;

	load: function () { return Promise.resolve(MENU); },
	getChildren: function (n) {

		return Object.keys(kids)
			.filter(function (k) { return kids[k].satisfied && kids[k].title != null; })
			.map(function (k) {

function esc(s) {

	REPORT.push(line);

	/* the CDP runner reads the raw innerHTML back into its <pre>, so the
	   entities are what the shared parser expects */
	window.__lucentReportHtml = REPORT.map(esc).join('\n');
	if (!ok)
		document.title = 'HARNESS_FAILED';

/* Surface setup failures instead of swallowing them as unhandled rejections. */
function bail(where, err) {
	REPORT.push('THREW in %s — %s'.format(where, (err && err.stack || err)));
	document.getElementById('report').textContent = REPORT.join('\n');
	window.__lucentReportHtml = REPORT.map(esc).join('\n');
	document.getElementById('root').textContent = 'RUNTIME ERROR in %s: %s'.format(where, err && err.stack || err);
	document.title = 'HARNESS_ERROR';
	window.__lucentDone = true;

async function mod(path) {
	var resp = await fetch(path);
	var src = await resp.text();
	var fn = new Function('L', 'rpc', 'baseclass', 'uci', 'poll', 'view', 'E', '_', 'ui', 'core', 'util', src);
	var res = fn(window.L, rpc, baseclass, uci, poll, view, E, window._, ui, registry.core, registry.util);

	if (res === undefined)
		throw new Error('%s → %d %d bytes, body starts %s'.format(path, resp.status, src.length, JSON.stringify(src.slice(0, 60))));

	/* LuCI's require() does `new _class()`, and Class calls `__init__` — with
	   trailing underscores. Calling anything else here is how the harness stayed
	   green for weeks while the real page never ran the module's constructor. */
	if (typeof res.__init__ === 'function')
		res.__init__();

	return res;
}

/* absolute, so the later pathname rewrite cannot break these fetches */
var base = new URL('../htdocs/luci-static/resources/', document.baseURI).href;

function wait(ms) {
	return new Promise(function (r) { setTimeout(r, ms); });
}

var FLAGS = location.hash || '';

/* the menu-source line is a diagnostic the theme hides in normal use, and the
   assertions below read it off the page, so ask for it here rather than
   shipping debug text in a router footer */
window.__lucentDebug = true;

/* The menu is cached in localStorage per session, so every scenario starts
   from a clean slate — otherwise a run of the healthy tree would let the
   failure runs paint from it and hide the very fallback being tested.
   #menu-cache is the exception: it seeds the copy on purpose. */
var menuCache = /#menu-cache/.test(FLAGS);
var menuNoStore = /#menu-nostore/.test(FLAGS);

	localStorage.clear();
	if (menuCache)
		localStorage.setItem('lucent.menu.anon', JSON.stringify({ b: 12, d: JSON.stringify(MENU) }));
} catch (e) {}

	/* private mode, and a few embedded browsers, refuse localStorage outright:
	   then the instant paint can never happen on any page, and that has to be
	   visible instead of looking like a broken cache */
	localStorage.setItem = function () { throw new Error('QuotaExceededError (mock private mode)'); };

/* ---------------------------------------------------------------------------
   A generic LuCI page. Interfaces, Wireless, Firewall rules and Software are
   drawn by LuCI's own JS against cbi/DML markup: nothing in this repository
   writes those class names, which is also why nothing in this repository had
   ever measured them. The structure below is the real one — .cbi-value rows,
   a .table.cbi-section-table with as many columns as a rules table gets, the
   .node-tree of the wireless page, the .ifacebox grid of status → overview
   and the pending-changes list the apply banner shows.
--------------------------------------------------------------------------- */
function genericPage() {
	function field(type, value, cls) {
		var i = E('input', { 'type': type, 'class': cls || 'cbi-input-text' });
		if (value != null)
			i.value = value;
		return i;
	}

	function dropdown(items, chosen) {
		var ul = E('ul', { 'class': 'dropdown' });

		items.forEach(function (t) {
			ul.appendChild(E('li', { 'data-value': t, 'selected': t === chosen ? '1' : null }, t));
		});

		/* LuCI shows the current selection in a li marked with a `display`
		   attribute; without it the closed dropdown is an empty box, and the
		   mock would then be measuring a widget the real page never renders */
		return E('div', { 'class': 'cbi-dropdown', 'tabindex': '0' }, [
			E('ul', {}, [E('li', { 'display': '1' }, chosen)]),
			ul, E('span', { 'class': 'more' }, '▾'), E('span', { 'class': 'open' }, '▾')
		]);
	}

	function dynlist(values) {
		var box = E('div', { 'class': 'cbi-dynlist' });

		values.forEach(function (v) {
			box.appendChild(E('div', { 'class': 'item' }, [E('span', {}, v)]));
		});
		box.appendChild(E('div', { 'class': 'add-item' }, [
			field('text', ''), E('input', { 'type': 'button', 'class': 'cbi-button cbi-button-add', 'value': '+' })
		]));
		return box;
	}

	function valueRow(title, f, descr) {
		return E('div', { 'class': 'cbi-value' }, [
			E('label', { 'class': 'cbi-value-title' }, title),
			E('div', { 'class': 'cbi-value-field' }, [f, descr ? E('div', { 'class': 'cbi-value-description' }, descr) : ''])
		]);
	}

	var form = E('div', { 'class': 'cbi-map' }, [
		E('h2', {}, 'Interface Configuration'),
		E('div', { 'class': 'cbi-map-descr' }, 'General setup of the WAN interface. A description long enough to wrap is normal here and must not push the field column sideways.'),
		E('div', { 'class': 'cbi-section' }, [
			E('h3', {}, 'General Configuration'),
			E('div', { 'class': 'cbi-section-descr' }, 'These settings apply to the interface itself.'),
			E('div', { 'class': 'cbi-section-node' }, [
				valueRow('Interface name', field('text', 'wan')),
				valueRow('PMTU / MTU bytes', field('text', '1492'), 'Set to 1492 for PPPoE connections; leave empty to use the driver default.'),
				valueRow('Override MAC address', field('text', '00:11:22:33:44:55')),
				valueRow('Bring up on boot', E('span', {}, [field('checkbox'), E('label', {}, 'enabled')])),
				valueRow('Protocol', dropdown(['static', 'dhcp', 'pppoe', 'PPTP VPN'], 'pppoe')),
				valueRow('DNS servers', dynlist(['223.5.5.5', '119.29.29.29', '8.8.8.8']))
			])
		]),
		E('div', { 'class': 'cbi-page-actions' }, [
			E('input', { 'type': 'submit', 'class': 'btn cbi-button cbi-button-apply', 'value': 'Save & Apply' }),
			E('input', { 'type': 'submit', 'class': 'btn cbi-button cbi-button-reset', 'value': 'Cancel' })
		])
	]);

	var heads = ['Name', 'Protocol', 'Source zone', 'Destination zone', 'Action'];
	var titles = E('tr', { 'class': 'tr table-titles' });
	var table = E('table', { 'class': 'table cbi-section-table' }, titles);

	heads.forEach(function (h) { titles.appendChild(E('th', { 'class': 'th' }, h)); });

/* The login screen is the theme's own template, so read the real file instead
   of re-typing it: the mock cannot then drift from what ships. Control tags
   are dropped and their bodies kept, which also exercises the error branch. */
function loginBlock() {
	var box = E('div', { 'class': 'ltc-login-mock' });

	return fetch('../ucode/template/themes/lucent/sysauth.ut')
		.then(function (r) { return r.ok ? r.text() : ''; })
		.then(function (tpl) {
			var html = String(tpl)
				.replace(/\{%[\s\S]*?%\}/g, '')
				.replace(/\{\{\s*_\('([^']*)'\)\s*\}\}/g, '$1')
				.replace(/\{\{[\s\S]*?\}\}/g, '');

			box.innerHTML = html;
			return box.children.length ? box : null;
		});
}

/* The apply-changes dialog is LuCI's own overlay: it is fixed, it holds a
   scrollable list, and its buttons are the last thing a user has to hit. */
function modalBlock() {
	var list = E('div', { 'class': 'uci-change-list' });

	for (var i = 0; i < 12; i++)
		list.appendChild(E('div', {}, [E('var', {}, 'network.wan' + i), E('ins', {}, "option mtu '1492'")]));

	return E('div', { 'id': 'modal_overlay' }, [
		E('div', { 'class': 'modal dlg' }, [
			E('h3', {}, 'Apply configuration changes'),
			E('div', { 'class': 'modal-body' }, [
				E('p', {}, 'LuCI will commit the following changes and restart the affected services.'),
				list
			]),

				E('input', { 'type': 'button', 'class': 'btn cbi-button-reset', 'value': 'Dismiss' })
			])
		])
	]);
}

				/* seven interface tabs on a 320px screen: they may wrap, but the
				   active one must still be marked and none may hang off the edge */
				var tabs = document.querySelectorAll('#tabmenu .cbi-tabmenu > li');
				var tabTops = {};
				var tabBad = [];

				Array.prototype.forEach.call(tabs, function (li) {
					var r = li.getBoundingClientRect();
					var a = li.querySelector('a');

					if (r.right > vw + 1 || r.width < 20)
						tabBad.push((a ? a.textContent : '?') + ' ' + Math.round(r.width) + '..' + Math.round(r.right));

					tabTops[Math.round(r.top)] = (tabTops[Math.round(r.top)] || 0) + 1;
				});

				check('tabs: the interface tab row stays on screen',
					tabs.length === 7 && !tabBad.length,
					tabs.length + ' tabs in ' + Object.keys(tabTops).length + ' row(s)' +
						(tabBad.length ? ' · ' + tabBad.slice(0, 3).join(' / ') : ''));
				check('tabs: the active tab is marked',
					!!document.querySelector('#tabmenu .cbi-tab > a') &&
					getComputedStyle(document.querySelector('#tabmenu .cbi-tab > a')).borderBottomColor !== 'transparent',
					document.querySelector('#tabmenu .cbi-tab > a')
						? getComputedStyle(document.querySelector('#tabmenu .cbi-tab > a')).borderBottomWidth : 'none');

				/* fitting on the screen is not the same as being themed: with no
				   rule at all these widgets still lay out fine, they just arrive
				   in bootstrap's look. Each predicate below is one thing only
				   this stylesheet could have done. */
				var unthemed = [];
				var THEME = [
					['.ltc-generic .uci-change-list ins', function (cs) { return cs.backgroundColor !== 'rgba(0, 0, 0, 0)'; }, 'added line'],
					['.ltc-generic .uci-change-legend', function (cs) { return cs.display === 'flex'; }, 'change legend'],
					['.ltc-generic .badge', function (cs) { return parseFloat(cs.borderTopLeftRadius) > 0; }, 'badge'],
					['.ltc-generic .notice', function (cs) { return parseFloat(cs.borderLeftWidth) >= 2; }, 'notice'],
					['.ltc-generic .node-tree', function (cs) { return cs.listStyleType === 'none'; }, 'wireless tree'],
					['.ltc-generic .node-tree', function (cs) { return parseFloat(cs.borderLeftWidth) > 0; }, 'tree guide line'],
					['.ltc-generic .cbi-section', function (cs) { return parseFloat(cs.borderTopLeftRadius) > 0; }, 'form section'],
					['.ltc-generic .cbi-page-actions', function (cs) { return cs.position === 'sticky'; }, 'sticky save bar'],
					['.ltc-generic .cbi-dropdown', function (cs) { return parseFloat(cs.borderTopLeftRadius) > 0; }, 'dropdown'],
					['.ltc-login-card', function (cs) { return parseFloat(cs.borderTopLeftRadius) > 0; }, 'login card']
				];

				THEME.forEach(function (t) {
					var el = document.querySelector(t[0]);

					if (!el) { unthemed.push(t[2] + ' missing'); return; }
					if (!t[1](getComputedStyle(el)))
						unthemed.push(t[2] + ' not themed');
				});

				check('generic: the widgets are themed, not just laid out',
					!unthemed.length, unthemed.join(' / ') || 'all 10 styled');

				var loginCard = document.querySelector('.ltc-login-card');
				var loginR = loginCard ? loginCard.getBoundingClientRect() : null;

				check('login: the card leaves room on both sides',
					!!loginR && loginR.left >= -1 && loginR.width <= vw * 0.95 && loginR.width > 200,
					loginR ? Math.round(loginR.left) + '..' + Math.round(loginR.right) + ' of ' + vw : 'no card');

				/* the palette: an input that cannot be reached, or a list that
				   runs past the screen, is the whole feature failing */
				var pal = document.querySelector('.ltc-search');
				var palBox = pal ? pal.querySelector('.ltc-search-box') : null;
				var palInput = pal ? pal.querySelector('input') : null;

				check('palette: it opened', !!pal && pal.classList.contains('show') &&
					document.body.classList.contains('ltc-search-open'),
					pal ? pal.className : 'no overlay built');
				check('palette: the box fits the screen',
					!!palBox && palBox.getBoundingClientRect().left >= -1 &&
					palBox.getBoundingClientRect().right <= vw + 1 &&
					palBox.getBoundingClientRect().bottom <= innerHeight + 1,
					palBox ? Math.round(palBox.getBoundingClientRect().width) + 'x' +
						Math.round(palBox.getBoundingClientRect().height) : 'no box');
				check('palette: the field is focusable and empty',
					!!palInput && palInput.value === '' && palInput.getBoundingClientRect().height >= (isPhone ? 30 : 24),
					palInput ? Math.round(palInput.getBoundingClientRect().height) + 'px' : 'no input');
			}

			if (isPhone) {
				var side = document.querySelector('.ltc-side');
				check('phone: the drawer leaves the page visible beside it',
					!!side && side.getBoundingClientRect().width <= vw * 0.87,
					side ? Math.round(side.getBoundingClientRect().width) + 'px of ' + innerWidth : 'no sidebar');
			}

			/* geometry cannot say whether the drawer can actually be shut: a tap
			   outside must close it, a tap inside must not */
			if (/#phone-open/.test(FLAGS)) {
				var tapErr = null;
				var onError = function (ev) { tapErr = tapErr || String(ev.message || ev.error); };
				/* most of the page is links, and following one ends the run on a
				   404 — cancelling the default action in capture stops the
				   navigation without hiding the click from the theme's handlers */
				var noNav = function (ev) { ev.preventDefault(); };

				window.addEventListener('error', onError);
				document.addEventListener('click', noNav, true);

				function tap(el) {
					if (el)
						el.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
					return !!el;
				}

				/* the scenario opens the drawer by hand for the geometry pass, so
				   start this one from a known closed state */
				document.body.classList.remove('ltc-menu-open');

				tap(document.querySelector('.ltc-burger'));
				check('phone: the burger opens the drawer',
					document.body.classList.contains('ltc-menu-open'), document.body.className);

				tap(document.querySelector('.ltc-side-info'));
				check('phone: a tap inside the drawer leaves it open',
					document.body.classList.contains('ltc-menu-open'), document.body.className);

				/* the drawing inside the icon, because that is what a finger
				   actually hits and what the dismissal has to reason about */
				var icon = document.querySelector('.ltc-kpi svg path, .ltc-hero svg path, .ltc-graph path, ' +
					'.ltc-kpi svg, .ltc-hero svg, .ltc-graph svg');
				var tappedIcon = tap(icon);
				check('phone: the outside tap could be made on an icon', tappedIcon,
					icon ? icon.tagName : 'no svg on the page');
				check('phone: a tap outside the drawer closes it',
					!document.body.classList.contains('ltc-menu-open'), document.body.className);
				check('phone: the icon tap did not throw', tapErr === null, tapErr || 'clean');

				document.removeEventListener('click', noNav, true);
				window.removeEventListener('error', onError);
			}
		}

		if (/#tree-noisy/.test(FLAGS)) {
			var gRows = document.querySelectorAll('.ltc-gnode').length;
			var gPorts = document.querySelectorAll('.ltc-gnode.port').length;
			var gOther = document.querySelectorAll('.ltc-gnode.other').length;
			var gLeaves = document.querySelectorAll('.ltc-gnode.leaf').length;

			check('idle ports collapsed', gPorts === 0 && gOther === 1, gPorts + ' port rows, ' + gOther + ' summary rows');
			check('graph stays short', gRows <= 12, gRows + ' nodes for 22 ports + 15 hosts');
			check('stray hosts capped at 6', gLeaves === 6, gLeaves + ' leaves before expanding');
			var gMore = document.querySelector('.ltc-gnode.more');
			if (gMore) {
				gMore.dispatchEvent(new MouseEvent('click', { bubbles: true }));
				check('more reveals the rest', document.querySelectorAll('.ltc-gnode.leaf').length === 15,
					document.querySelectorAll('.ltc-gnode.leaf').length + ' leaves after click');
			}
			else {
				check('more reveals the rest', false, 'no toggle found');
			}
		}

		return v.applyLive(dash);
	}).then(function () {
		/* second dashboard poll round, per the live-widget rule */
		MOCK['luci-rpc.getNetworkDevices']['pppoe-wan'] = { statistics: { rx_bytes: 1270000000, tx_bytes: 358900000 } };
		if (dhcpwan)
			MOCK['luci-rpc.getNetworkDevices']['eth0.2'] = { statistics: { rx_bytes: 1270000000, tx_bytes: 358900000 } };
		MOCK['luci.lucent.host_rates'].bump = 1;
		return v.load();
	}).then(function (d2) {
		var cell = document.querySelector('[data-live=leaf-192-168-1-30]');
		var before = cell ? cell.textContent : '';
		v.applyLive(d2);
		var after = cell ? cell.textContent : '';
		if (!noisy) check('graph rate refreshed', before !== after, before + ' → ' + after);

		/* the curves can only be measured once the boxes are laid out, which is
		   what applyLive does — so this belongs after the first paint. Below
		   980px the graph folds into an indented list and CSS hides the SVG. */
		var links = document.querySelectorAll('svg.ltc-glinks path');
		if (innerWidth > 980) {
			check('connectors drawn', links.length >= 4, links.length + ' curves');
			check('curves are real beziers', links.length > 0 && Array.prototype.every.call(links, function (p) {
				var d = p.getAttribute('d');
				var n = (d.match(/-?[\d.]+/g) || []).map(Number);
				/* M x y C cx1 cy1 cx2 cy2 x y — eight numbers, and the two ends
				   must actually be apart or there is nothing to see */
				return /^M[-\d.]+ [-\d.]+ C[-\d. ]+$/.test(d) && n.length === 8 && n[6] > n[0];
			}), links.length && links[0].getAttribute('d').slice(0, 40));
		}
		else {
			check('narrow screens use the indented list', true, links.length + ' curves at ' + innerWidth + 'px');
		}
		return wait(400);
	}).then(function () {
		var live = document.querySelector('[data-live=spark-now]');
		check('dashboard live after 2nd round', !!(live && /↓/.test(live.textContent)), live && live.textContent);

		var lease = document.querySelector('[data-live=lease]');
		check('dhcp lease derived', !dhcpwan || (lease && lease.textContent !== '–'), lease && lease.textContent);
		var gw = document.querySelector('[data-live=gateway]');
		check('dhcp gateway read', !dhcpwan || (gw && gw.textContent === '10.0.0.1'), gw && gw.textContent);

		/* ---- sidebar collapse control ----
		   It used to be a third identical 36px square in the footer row, which
		   is why the report was "I cannot find the entry point". */
		var railBtn = document.querySelector('[data-ltc-rail]');
		check('rail toggle rendered', !!railBtn, railBtn && railBtn.className);
		check('rail toggle sits on the sidebar edge, not the footer row',
			!!railBtn && railBtn.parentElement === document.querySelector('.ltc-side'),
			railBtn && railBtn.parentElement && (railBtn.parentElement.className || railBtn.parentElement.tagName));
		check('rail toggle carries its own words',
			!!railBtn && /sidebar/i.test(railBtn.textContent), railBtn && railBtn.textContent);

		/* the width rule, with both bounds: below 981 the sidebar is a drawer
		   and rail must not be set at all — that is the 3.6.9 regression, where
		   auto-collapse reached phones and left a sliver column on screen.
		   No stored preference here, so the window decides. */
		var wantRail = window.innerWidth < 981 ? undefined : (window.innerWidth < 1281 ? '1' : '0');
		check('rail follows the width rule',
			document.documentElement.dataset.rail === wantRail,
			'window ' + window.innerWidth + ' -> ' + document.documentElement.dataset.rail + ' want ' + wantRail);
		check('no rail mode on a phone window',
			window.innerWidth >= 981 || document.documentElement.dataset.rail === undefined,
			'window ' + window.innerWidth + ' rail=' + document.documentElement.dataset.rail);

		/* header.ut repeats the thresholds inline to avoid a first-paint flash;
		   two copies of one rule is exactly what drifts, so assert they agree.
		   The CSS gate matters the same way: rail styles must never reach a
		   phone, which is what wrecked 3.6.9. */
		Promise.all([
			fetch('../ucode/template/themes/lucent/header.ut').catch(function () { return { ok: false }; }),
			fetch('../htdocs/luci-static/lucent/theme.css').catch(function () { return { ok: false }; })
		]).then(function (rs) {
			return Promise.all(rs.map(function (r) { return r && r.ok ? r.text() : ''; }));
		}).then(function (txt) {
			var tpl = txt[0], css = txt[1];

			if (!tpl)
				REPORT.push('SKIP header.ut threshold parity (template not served)');
			else {
				var mins = tpl.match(/innerWidth >= (\d+)/);
				var maxs = tpl.match(/innerWidth < (\d+)/);
				check('header.ut and core.js agree on the rail minimum',
					!!mins && +mins[1] === registry.core.RAIL_MIN, (mins && mins[1]) + ' vs ' + registry.core.RAIL_MIN);
				check('header.ut and core.js agree on the auto-collapse maximum',
					!!maxs && +maxs[1] === registry.core.RAIL_AUTO_MAX, (maxs && maxs[1]) + ' vs ' + registry.core.RAIL_AUTO_MAX);
			}

			if (!css)
				REPORT.push('SKIP rail css gate (stylesheet not served)');
			else {
				var desktop = css.indexOf('@media (min-width:981px)');
				var pill = css.indexOf('.ltc-rail-toggle{');
				check('rail pill styles are inside the desktop media query',
					desktop >= 0 && pill > desktop, 'gate@' + desktop + ' pill@' + pill);
				check('rail pill is hidden outside desktop',
					/^\.ltc-rail-toggle\{display:none\}/m.test(css), 'no global hide');
			}
		});

		if (/#rail/.test(FLAGS))
			document.documentElement.dataset.rail = '1';
		if (/#drawer/.test(FLAGS) || /#phone-open/.test(FLAGS))
			document.body.classList.add('ltc-menu-open');
		if (/#report/.test(FLAGS))
			document.body.classList.add('show-report');
		/* a photographing aid, like #tall: put the topology card in the middle
		   of the window so the shot shows the graph at readable scale */
		if (/#graph/.test(FLAGS)) {
			var g = document.querySelector('.ltc-graph');
			if (g)
				g.scrollIntoView({ block: 'center' });
		}
		/* same idea for the devices table, which lives below the fold on a phone
		   and so never appears in a phone screenshot */
		if (/#phone-clients/.test(FLAGS)) {
			var ct = document.querySelector('.ltc-clients');
			if (ct)
				ct.scrollIntoView({ block: 'start' });
		}
		/* the generic page is appended after the theme's own views, so a shot of
		   the top of the document would show none of it */
		if (/generic/.test(FLAGS)) {
			/* measured above; taken out now so the picture shows the page and
			   not the dialog that was only there to be sized */
			var mo = document.getElementById('modal_overlay');
			if (mo)
				mo.parentNode.removeChild(mo);

			document.body.classList.remove('ltc-search-open');
			var so = document.querySelector('.ltc-search');
			if (so)
				so.classList.remove('show');

			var gp = document.querySelector('.ltc-generic');
			if (gp)
				gp.scrollIntoView({ block: 'start' });
		}
		if (/settings/.test(FLAGS)) {
			var sp = document.querySelector('.ltc-plugins');
			if (sp)
				sp.scrollIntoView({ block: 'start' });
		}

		document.title = /FAIL|THREW/.test(REPORT.join('\n')) ? 'HARNESS_FAILED' : 'HARNESS_READY';
		/* tests/frame.html runs the page inside a real phone-sized frame and can
		   only read the report once it is complete, so say so explicitly instead
		   of making it guess from the title — the title used to flip to READY
		   halfway through, which quietly dropped the last eight assertions */
		window.__lucentDone = true;
	}).catch(function (err) {
		bail('chain', err);
	});
})().catch(function (err) {
	bail('setup', err);
});
</script>
</body>
</html>
